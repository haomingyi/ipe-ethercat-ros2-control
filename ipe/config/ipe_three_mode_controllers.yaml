controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    ipe_position_controller:
      type: position_controllers/JointGroupPositionController
    ipe_velocity_raw_controller:
      type: forward_command_controller/ForwardCommandController
    ipe_torque_raw_controller:
      type: forward_command_controller/ForwardCommandController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - ipe_joint
    interfaces:
      - position
      - velocity
      - velocity_raw
      - torque_raw

ipe_position_controller:
  ros__parameters:
    joints:
      - ipe_joint

ipe_velocity_raw_controller:
  ros__parameters:
    joints:
      - ipe_joint
    interface_name: velocity_raw

ipe_torque_raw_controller:
  ros__parameters:
    joints:
      - ipe_joint
    interface_name: torque_raw
